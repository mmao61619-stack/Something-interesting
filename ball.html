function drawHole() {
    const ex = CFG.CX, ey = CFG.CY;
    const t = Date.now() / 1000;

    // 动画参数
    const jawOpen = 0.6 + Math.sin(t * 2.5) * 0.22 + Math.sin(t * 1.7) * 0.13; // 嘴巴开合 0.25~0.95
    const tongueY = Math.sin(t * 4.2) * 5;
    const tongueX = Math.sin(t * 3.1) * 3;
    const eyeGlow = 0.7 + Math.sin(t * 0.9) * 0.3; // 眼睛闪烁

    // ===== 深渊背景（大圆，怪物从中探出） =====
    const holeGrad = ctx.createRadialGradient(ex, ey, 10, ex, ey, 80);
    holeGrad.addColorStop(0, '#000');
    holeGrad.addColorStop(0.45, '#1a0505');
    holeGrad.addColorStop(0.75, '#3a0a0a');
    holeGrad.addColorStop(1, 'rgba(30, 5, 5, 0)');
    ctx.fillStyle = holeGrad;
    ctx.beginPath();
    ctx.arc(ex, ey, 80, 0, Math.PI * 2);
    ctx.fill();

    // ===== 金色太阳光环（旋转） =====
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(t * 0.3);
    const sunAlpha = 0.25 + Math.sin(t * 0.8) * 0.08;
    ctx.fillStyle = `rgba(220, 180, 60, ${sunAlpha})`;
    for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - 0.15) * 55, Math.sin(a - 0.15) * 55);
        ctx.lineTo(Math.cos(a) * 78, Math.sin(a) * 78);
        ctx.lineTo(Math.cos(a + 0.15) * 55, Math.sin(a + 0.15) * 55);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();

    // 内圈金色圆环
    ctx.strokeStyle = `rgba(220, 180, 60, ${0.4 + Math.sin(t * 0.6) * 0.1})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(ex, ey, 52, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(220, 180, 60, ${0.2 + Math.sin(t * 0.6 + 1) * 0.05})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(ex, ey, 58, 0, Math.PI * 2);
    ctx.stroke();

    // ===== 怪物头部轮廓（暗色，从深渊中探出） =====
    ctx.fillStyle = '#1a0a0a';
    ctx.beginPath();
    ctx.ellipse(ex, ey - 5, 50, 46, 0, 0, Math.PI * 2);
    ctx.fill();

    // 头部顶部隆起（更有立体感）
    const headTopGrad = ctx.createRadialGradient(ex - 10, ey - 25, 8, ex, ey - 20, 40);
    headTopGrad.addColorStop(0, '#2a1515');
    headTopGrad.addColorStop(1, '#1a0a0a');
    ctx.fillStyle = headTopGrad;
    ctx.beginPath();
    ctx.ellipse(ex, ey - 20, 35, 28, 0, 0, Math.PI * 2);
    ctx.fill();

    // ===== 头部鳞片纹理 =====
    ctx.strokeStyle = 'rgba(80, 40, 40, 0.35)';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(ex + Math.cos(a) * 22, ey - 5 + Math.sin(a) * 20);
        ctx.lineTo(ex + Math.cos(a) * 42, ey - 5 + Math.sin(a) * 38);
        ctx.stroke();
    }

    // ===== 弯曲的角（左右各一） =====
    // 左角
    ctx.strokeStyle = '#3a2020';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(ex - 40, ey - 18);
    ctx.quadraticCurveTo(ex - 65, ey - 35, ex - 58, ey - 62);
    ctx.stroke();
    ctx.fillStyle = '#4a2a2a';
    ctx.beginPath();
    ctx.moveTo(ex - 58, ey - 62);
    ctx.lineTo(ex - 63, ey - 75);
    ctx.lineTo(ex - 52, ey - 68);
    ctx.closePath();
    ctx.fill();
    // 右角
    ctx.strokeStyle = '#3a2020';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(ex + 40, ey - 18);
    ctx.quadraticCurveTo(ex + 65, ey - 35, ex + 58, ey - 62);
    ctx.stroke();
    ctx.fillStyle = '#4a2a2a';
    ctx.beginPath();
    ctx.moveTo(ex + 58, ey - 62);
    ctx.lineTo(ex + 63, ey - 75);
    ctx.lineTo(ex + 52, ey - 68);
    ctx.closePath();
    ctx.fill();

    // ===== 发红光的眼睛（凶恶，带闪烁） =====
    // 左眼
    const eyeGrad1 = ctx.createRadialGradient(ex - 20, ey - 30, 2, ex - 20, ey - 30, 14);
    eyeGrad1.addColorStop(0, `rgba(255, ${Math.floor(40 + 30 * eyeGlow)}, ${Math.floor(40 + 30 * eyeGlow)}, ${eyeGlow})`);
    eyeGrad1.addColorStop(0.4, `rgba(204, ${Math.floor(20 + 20 * eyeGlow)}, ${Math.floor(20 + 20 * eyeGlow)}, ${eyeGlow * 0.8})`);
    eyeGrad1.addColorStop(1, 'rgba(100, 15, 15, 0)');
    ctx.fillStyle = eyeGrad1;
    ctx.beginPath();
    ctx.ellipse(ex - 20, ey - 30, 12, 10, -0.15, 0, Math.PI * 2);
    ctx.fill();
    // 竖瞳
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(ex - 20, ey - 30, 3, 7, -0.15, 0, Math.PI * 2);
    ctx.fill();

    // 右眼
    const eyeGrad2 = ctx.createRadialGradient(ex + 20, ey - 30, 2, ex + 20, ey - 30, 14);
    eyeGrad2.addColorStop(0, `rgba(255, ${Math.floor(40 + 30 * eyeGlow)}, ${Math.floor(40 + 30 * eyeGlow)}, ${eyeGlow})`);
    eyeGrad2.addColorStop(0.4, `rgba(204, ${Math.floor(20 + 20 * eyeGlow)}, ${Math.floor(20 + 20 * eyeGlow)}, ${eyeGlow * 0.8})`);
    eyeGrad2.addColorStop(1, 'rgba(100, 15, 15, 0)');
    ctx.fillStyle = eyeGrad2;
    ctx.beginPath();
    ctx.ellipse(ex + 20, ey - 30, 12, 10, 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(ex + 20, ey - 30, 3, 7, 0.15, 0, Math.PI * 2);
    ctx.fill();

    // ===== 鼻子（两个扁平鼻孔） =====
    ctx.fillStyle = '#2a1010';
    ctx.beginPath();
    ctx.ellipse(ex - 10, ey - 8, 5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(ex + 10, ey - 8, 5, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // ===== 会动的撕裂大嘴巴 =====
    const mouthW = 38;
    const mouthH = 26 * jawOpen;
    const mouthY = ey + 14 + (1 - jawOpen) * 8;

    ctx.fillStyle = '#2a0505';
    ctx.beginPath();
    ctx.ellipse(ex, mouthY, mouthW, Math.max(4, mouthH), 0, 0, Math.PI * 2);
    ctx.fill();

    // 口腔深处（黑洞）
    const throatH = 16 * jawOpen;
    const throatGrad = ctx.createRadialGradient(ex, mouthY + 4, 3, ex, mouthY + 4, 24);
    throatGrad.addColorStop(0, '#000');
    throatGrad.addColorStop(1, '#1a0202');
    ctx.fillStyle = throatGrad;
    ctx.beginPath();
    ctx.ellipse(ex, mouthY + 4, 22, Math.max(3, throatH), 0, 0, Math.PI * 2);
    ctx.fill();

    // ===== 舌头（来回舔动） =====
    if (jawOpen > 0.4) {
        ctx.fillStyle = '#cc3333';
        ctx.beginPath();
        ctx.ellipse(ex + tongueX, mouthY + 6 + tongueY, 10, 5, tongueX * 0.05, 0, Math.PI * 2);
        ctx.fill();
        // 舌头高光
        ctx.fillStyle = 'rgba(255, 150, 150, 0.4)';
        ctx.beginPath();
        ctx.ellipse(ex + tongueX + 2, mouthY + 4 + tongueY, 4, 2, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // ===== 上排尖牙（随嘴巴开合移动） =====
    ctx.fillStyle = '#e0d8c0';
    const upperTeethY = mouthY - mouthH + 2;
    for (let i = -2; i <= 2; i++) {
        const tx = ex + i * 11;
        const tilt = i * 0.12;
        const h = (8 + Math.abs(i) * 3) * jawOpen;
        if (h < 2) continue;
        ctx.save();
        ctx.translate(tx, upperTeethY);
        ctx.rotate(tilt);
        ctx.beginPath();
        ctx.moveTo(-4, 0);
        ctx.lineTo(4, 0);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // ===== 下排尖牙（粗壮，向上生长） =====
    ctx.fillStyle = '#e0d8c0';
    const lowerTeethY = mouthY + mouthH - 2;
    for (let i = -1.5; i <= 1.5; i += 1) {
        const tx = ex + i * 13;
        const tilt = i * 0.1;
        const h = (10 + Math.abs(i) * 2) * jawOpen;
        if (h < 2) continue;
        ctx.save();
        ctx.translate(tx, lowerTeethY);
        ctx.rotate(tilt);
        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.lineTo(5, 0);
        ctx.lineTo(0, -h);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // ===== 嘴角撕裂伤口 =====
    ctx.strokeStyle = 'rgba(140, 30, 30, 0.7)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(ex - 36, mouthY);
    ctx.quadraticCurveTo(ex - 48, mouthY - 4, ex - 52, mouthY - 10);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ex + 36, mouthY);
    ctx.quadraticCurveTo(ex + 48, mouthY - 4, ex + 52, mouthY - 10);
    ctx.stroke();

    // ===== 嘴部周围褶皱皮肤 =====
    ctx.strokeStyle = 'rgba(60, 25, 25, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(ex, mouthY - 4, 44, 0.1, Math.PI - 0.1);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ex, mouthY, 48, 0.05, Math.PI - 0.05);
    ctx.stroke();

    // ===== 外圈危险光环 =====
    ctx.strokeStyle = `rgba(220, 50, 30, ${0.3 + Math.sin(t * 3) * 0.1})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(ex, ey, 58, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(220, 50, 30, ${0.15 + Math.sin(t * 2.5) * 0.08})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(ex, ey, 64, 0, Math.PI * 2);
    ctx.stroke();
}

function drawBallGlyph(cIdx, r) {
    // 每种颜色独特的"石刻符文"，深色雕刻感
    ctx.save();
    const dark = 'rgba(0,0,0,0.35)';
    const light = 'rgba(255,255,255,0.22)';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    switch (cIdx % 6) {
        case 0: // 红 — 螺旋纹
            ctx.strokeStyle = dark;
            ctx.lineWidth = r * 0.14;
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 4; a += 0.2) {
                const rr = r * 0.12 + a * r * 0.06;
                const px = Math.cos(a) * rr;
                const py = Math.sin(a) * rr;
                if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.strokeStyle = light;
            ctx.lineWidth = r * 0.06;
            ctx.stroke();
            break;
        case 1: // 蓝 — 波浪纹
            ctx.strokeStyle = dark;
            ctx.lineWidth = r * 0.13;
            ctx.beginPath();
            for (let i = -2; i <= 2; i++) {
                const yy = i * r * 0.22;
                ctx.moveTo(-r * 0.4, yy);
                ctx.quadraticCurveTo(0, yy - r * 0.18, r * 0.4, yy);
            }
            ctx.stroke();
            ctx.strokeStyle = light;
            ctx.lineWidth = r * 0.05;
            ctx.stroke();
            break;
        case 2: // 绿 — 三叶纹
            ctx.strokeStyle = dark;
            ctx.lineWidth = r * 0.14;
            for (let i = 0; i < 3; i++) {
                const a = (i / 3) * Math.PI * 2;
                ctx.beginPath();
                ctx.arc(Math.cos(a) * r * 0.22, Math.sin(a) * r * 0.22, r * 0.18, a - 1, a + 2.2);
                ctx.stroke();
            }
            ctx.strokeStyle = light;
            ctx.lineWidth = r * 0.06;
            for (let i = 0; i < 3; i++) {
                const a = (i / 3) * Math.PI * 2;
                ctx.beginPath();
                ctx.arc(Math.cos(a) * r * 0.22, Math.sin(a) * r * 0.22, r * 0.18, a - 1, a + 2.2);
                ctx.stroke();
            }
            break;
        case 3: // 黄 — 太阳放射纹
            ctx.strokeStyle = dark;
            ctx.lineWidth = r * 0.12;
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * r * 0.15, Math.sin(a) * r * 0.15);
                ctx.lineTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5);
                ctx.stroke();
            }
            ctx.fillStyle = dark;
            ctx.beginPath(); ctx.arc(0, 0, r * 0.12, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = light;
            ctx.lineWidth = r * 0.05;
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * r * 0.15, Math.sin(a) * r * 0.15);
                ctx.lineTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5);
                ctx.stroke();
            }
            break;
        case 4: // 紫 — 菱形网格
            ctx.strokeStyle = dark;
            ctx.lineWidth = r * 0.11;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * r * 0.35 - r * 0.2);
                ctx.lineTo(r * 0.25, i * r * 0.35);
                ctx.lineTo(0, i * r * 0.35 + r * 0.2);
                ctx.lineTo(-r * 0.25, i * r * 0.35);
                ctx.closePath(); ctx.stroke();
            }
            ctx.strokeStyle = light;
            ctx.lineWidth = r * 0.04;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * r * 0.35 - r * 0.2);
                ctx.lineTo(r * 0.25, i * r * 0.35);
                ctx.lineTo(0, i * r * 0.35 + r * 0.2);
                ctx.lineTo(-r * 0.25, i * r * 0.35);
                ctx.closePath(); ctx.stroke();
            }
            break;
        case 5: // 橙 — 火焰三角
            ctx.strokeStyle = dark;
            ctx.lineWidth = r * 0.13;
            ctx.beginPath();
            ctx.moveTo(0, -r * 0.45);
            ctx.quadraticCurveTo(r * 0.35, -r * 0.1, 0, r * 0.35);
            ctx.quadraticCurveTo(-r * 0.35, -r * 0.1, 0, -r * 0.45);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -r * 0.25);
            ctx.quadraticCurveTo(r * 0.2, 0, 0, r * 0.15);
            ctx.quadraticCurveTo(-r * 0.2, 0, 0, -r * 0.25);
            ctx.stroke();
            ctx.strokeStyle = light;
            ctx.lineWidth = r * 0.05;
            ctx.stroke(); ctx.stroke();
            break;
    }
    ctx.restore();
}

function drawBall(x, y, cIdx, r, alpha = 1, rot = 0, special = null) {
    const col = COLORS[cIdx];
    ctx.save();
    ctx.globalAlpha = alpha;

    // 特殊球外发光
    if (special) {
        const glowColor = special === SPECIAL.BOMB ? 'rgba(255,80,40,0.4)' : 'rgba(80,180,255,0.4)';
        ctx.fillStyle = glowColor;
        ctx.beginPath();
        ctx.arc(x, y, r * 1.35, 0, Math.PI * 2);
        ctx.fill();
    }

    // 球体（跟随旋转）
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // 更立体的径向渐变，模拟抛光的石刻球
    const g = ctx.createRadialGradient(-r*0.35, -r*0.35, r*0.1, 0, 0, r);
    g.addColorStop(0, col.l);
    g.addColorStop(0.35, col.m);
    g.addColorStop(0.75, col.d);
    g.addColorStop(0.92, shadeColor(col.d, -20));
    g.addColorStop(1, shadeColor(col.d, -40));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fill();

    // 内圈石刻边框（让球看起来像古老石珠）
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = r * 0.08;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = r * 0.04;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.74, 0, Math.PI * 2);
    ctx.stroke();

    // 中心符文图案（跟随球滚动）
    drawBallGlyph(cIdx, r);

    // 特殊球符号 — Canvas绘制，更醒目
    if (special === SPECIAL.BOMB) {
        // 炸弹：红色裂纹 + 闪烁核心
        ctx.strokeStyle = 'rgba(255,60,20,0.9)';
        ctx.lineWidth = r * 0.1;
        ctx.lineCap = 'round';
        for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r * 0.2, Math.sin(a) * r * 0.2);
            ctx.lineTo(Math.cos(a) * r * 0.65, Math.sin(a) * r * 0.65);
            ctx.stroke();
            // 分支裂纹
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5);
            ctx.lineTo(Math.cos(a + 0.35) * r * 0.7, Math.sin(a + 0.35) * r * 0.7);
            ctx.stroke();
        }
        // 中心核心
        ctx.fillStyle = 'rgba(255,40,0,0.9)';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.1, 0, Math.PI * 2); ctx.fill();
    } else if (special === SPECIAL.SLOW) {
        // 减速：冰晶雪花
        ctx.strokeStyle = 'rgba(100,200,255,0.9)';
        ctx.lineWidth = r * 0.08;
        ctx.lineCap = 'round';
        for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6);
            ctx.stroke();
            // 小分叉
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45);
            ctx.lineTo(Math.cos(a - 0.35) * r * 0.6, Math.sin(a - 0.35) * r * 0.6);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45);
            ctx.lineTo(Math.cos(a + 0.35) * r * 0.6, Math.sin(a + 0.35) * r * 0.6);
            ctx.stroke();
        }
        // 中心六边形
        ctx.fillStyle = 'rgba(120,210,255,0.8)';
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2;
            if (i === 0) ctx.moveTo(Math.cos(a) * r * 0.18, Math.sin(a) * r * 0.18);
            else ctx.lineTo(Math.cos(a) * r * 0.18, Math.sin(a) * r * 0.18);
        }
        ctx.closePath(); ctx.fill();
    }

    // 滚动纹理暗部
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.arc(-r*0.35, r*0.25, r*0.22, 0, Math.PI*2);
    ctx.fill();

    // 滚动纹理亮部
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.arc(r*0.35, -r*0.15, r*0.18, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // 外部高光（固定光源，不随球旋转）
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.arc(x - r*0.3, y - r*0.3, r*0.28, 0, Math.PI*2);
    ctx.fill();

    // 边缘反光
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.92, -Math.PI * 0.8, -Math.PI * 0.2);
    ctx.stroke();

    ctx.restore();
}

function drawBalls() {
    for (const b of balls) {
        drawBall(b.x, b.y, b.c, CFG.BALL_R, 1, b.rot, b.special);
    }
}

function drawShot() {
    if (!shot) return;
    drawBall(shot.x, shot.y, shot.c, shot.r);
    ctx.fillStyle = COLORS[shot.c].m + '20';
    ctx.beginPath();
    ctx.arc(shot.x - shot.vx*0.3, shot.y - shot.vy*0.3, shot.r*0.9, 0, Math.PI*2);
    ctx.fill();
}

function drawShooter() {
    const city = getCity();
    switch (city.shooter) {
        case 'frog': drawFrog(); break;
        case 'lion': drawLion(); break;
        case 'dragon': drawDragon(); break;
        default: drawFrog(); break;
    }
}

function drawFrog() {
    ctx.save();
    ctx.translate(CFG.FROG_X, CFG.FROG_Y);
    ctx.rotate(angle + Math.PI/2);

    // === 封面同款卡通黄金蛙 ===

    // 底座阴影
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(0, 20, 52, 16, 0, 0, Math.PI*2); ctx.fill();

    // 石座
    const seatGrad = ctx.createLinearGradient(0, 10, 0, 26);
    seatGrad.addColorStop(0, '#B8860B');
    seatGrad.addColorStop(1, '#5A4018');
    ctx.fillStyle = seatGrad;
    ctx.beginPath(); ctx.ellipse(0, 16, 44, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#3d2b0f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 16, 44, 12, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.ellipse(0, 13, 36, 5, 0, 0, Math.PI*2); ctx.fill();

    // 后腿（小圆脚）
    ctx.fillStyle = '#D4A017';
    ctx.beginPath(); ctx.ellipse(-40, 12, 14, 10, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(40, 12, 14, 10, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(-40, 12, 14, 10, -0.3, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(40, 12, 14, 10, 0.3, 0, Math.PI*2); ctx.stroke();

    // 身体（圆滚滚黄金球）
    const bodyGrad = ctx.createRadialGradient(-6, -2, 6, 0, 2, 40);
    bodyGrad.addColorStop(0, '#FFF0A0');
    bodyGrad.addColorStop(0.35, '#FFD700');
    bodyGrad.addColorStop(0.75, '#E6B800');
    bodyGrad.addColorStop(1, '#C69500');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, 38, 30, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 38, 30, 0, 0, Math.PI*2); ctx.stroke();
    // 肚皮
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.ellipse(0, 6, 22, 16, 0, 0, Math.PI*2); ctx.fill();

    // 头部（更大更圆）
    const headGrad = ctx.createRadialGradient(-4, -30, 10, 0, -26, 48);
    headGrad.addColorStop(0, '#FFF5C2');
    headGrad.addColorStop(0.3, '#FFE066');
    headGrad.addColorStop(0.65, '#FFD700');
    headGrad.addColorStop(1, '#D4A017');
    ctx.fillStyle = headGrad;
    ctx.beginPath(); ctx.ellipse(0, -24, 46, 38, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, -24, 46, 38, 0, 0, Math.PI*2); ctx.stroke();
    // 脸颊红晕
    ctx.fillStyle = 'rgba(255,150,100,0.15)';
    ctx.beginPath(); ctx.ellipse(-26, -18, 10, 7, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(26, -18, 10, 7, 0.2, 0, Math.PI*2); ctx.fill();

    // 额头红色宝石（封面同款）
    ctx.fillStyle = '#D4A017';
    ctx.beginPath(); ctx.ellipse(0, -56, 12, 7, 0, 0, Math.PI*2); ctx.fill();
    const gemGrad = ctx.createRadialGradient(-2, -60, 1, 0, -58, 8);
    gemGrad.addColorStop(0, '#FF8585');
    gemGrad.addColorStop(0.5, '#EE4444');
    gemGrad.addColorStop(1, '#C0392B');
    ctx.fillStyle = gemGrad;
    ctx.beginPath(); ctx.arc(0, -58, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(-2, -61, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -58, 7, 0, Math.PI*2); ctx.stroke();

    // 超大可爱眼睛
    drawCuteEye(-22, -38);
    drawCuteEye(22, -38);

    // 张开的嘴巴（深色口腔，让球看起来像含在嘴里）
    ctx.fillStyle = '#5A3010';
    ctx.beginPath(); ctx.ellipse(0, -46, 15, 11, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, -48, 13, 0.3, Math.PI - 0.3); ctx.stroke();
    // 上嘴唇高光
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -49, 12, 0.3, Math.PI - 0.3); ctx.stroke();

    // 前肢

function drawStar(x, y, r, points, rot) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
        const a = rot + (i * Math.PI) / points;
        const rr = (i % 2 === 0) ? r : r * 0.4;
        if (i === 0) ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        else ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
}

function drawDragon() {

    ctx.beginPath(); ctx.ellipse(4, -12, 2.5, 1.5, 0, 0, Math.PI * 2); ctx.fill();

    // 11. 大嘴唇（含球）
    ctx.fillStyle = '#a01810';
    ctx.beginPath(); ctx.ellipse(0, 2, 28, 18, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#501008'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#d03020';
    ctx.beginPath(); ctx.ellipse(0, 2, 28, 18, 0, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = '#501008'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = '#f07060'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(-1, 1, 24, 14, 0, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();

    // 12. 龙爪（前肢）
    for (let side = -1; side <= 1; side += 2) {
        const fGrad = ctx.createRadialGradient(side * 32, 38, 2, side * 32, 42, 18);
        fGrad.addColorStop(0, '#e85038'); fGrad.addColorStop(0.7, '#c02018'); fGrad.addColorStop(1, '#701008');
        ctx.fillStyle = fGrad;
        ctx.beginPath(); ctx.ellipse(side * 32, 42, 16, 20, side * 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#501008'; ctx.lineWidth = 2.5; ctx.stroke();
        // 前脚掌
        const ffGrad = ctx.createRadialGradient(side * 36, 56, 2, side * 36, 58, 12);
        ffGrad.addColorStop(0, '#f07050'); ffGrad.addColorStop(1, '#801008');
        ctx.fillStyle = ffGrad;
        ctx.beginPath(); ctx.ellipse(side * 36, 58, 13, 10, side * 0.15, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#501008'; ctx.lineWidth = 2; ctx.stroke();
        // 爪
        for (let i = 0; i < 3; i++) {
            const cx = side * (40 + i * 5); const cy = 62 + i * 2;
            ctx.fillStyle = '#f8c040'; ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#a01810'; ctx.beginPath(); ctx.arc(cx + side * 0.5, cy + 0.5, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#f0d880'; ctx.beginPath(); ctx.arc(cx - side * 0.3, cy - 0.3, 2.5, 0, Math.PI * 2); ctx.fill();
        }
    }

    // 13. 尾巴尖
    ctx.strokeStyle = '#c02018'; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 48); ctx.quadraticCurveTo(20, 70, 50, 55); ctx.stroke();
    ctx.strokeStyle = '#e85038'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0, 48); ctx.quadraticCurveTo(20, 70, 50, 55); ctx.stroke();
    ctx.fillStyle = '#f8c040'; ctx.beginPath(); ctx.arc(50, 55, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#d4a030'; ctx.lineWidth = 2; ctx.stroke();
    // 尾尖火焰
    ctx.fillStyle = 'rgba(255, 160, 40, 0.6)';
    ctx.beginPath(); ctx.arc(50, 55, 14, 0, Math.PI * 2); ctx.fill();

    // 嘴里含的球
    drawBall(0, 2, curColor, CFG.BALL_R * 0.72, 1, 0);

    ctx.restore();

    // 下一个球（显示在后方）
    const nx = CFG.FROG_X + Math.cos(angle + Math.PI) * 42;
    const ny = CFG.FROG_Y + Math.sin(angle + Math.PI) * 42;
    drawBall(nx, ny, nextColor, CFG.BALL_R * 0.72, 1, 0);
}

function drawParticles() {
    for (const pt of particles) {
        const a = Math.max(0, pt.life);
        ctx.globalAlpha = a;
        if (pt.type === 'star') {
            ctx.fillStyle = pt.color;
            drawStar(pt.x, pt.y, pt.radius * a, 4, pt.rot || 0);
            ctx.fill();
            // 星核高亮
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.radius * a * 0.3, 0, Math.PI * 2);
            ctx.fill();
        } else if (pt.type === 'glow') {
            const gr = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, pt.radius * a * 2);
            gr.addColorStop(0, pt.color);
            gr.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gr;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.radius * a * 2, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = pt.color;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.radius * a, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

function drawGuide() {
    if (!running || shot) return;
    const sp = getShooterPos();
    const city = getCity();
    const maxLen = 220;
    const dx = Math.cos(angle);
    const dy = Math.sin(angle);
    // 在球链前留出安全距离，不画到球上
    let len = maxLen;
    const safeDist = CFG.BALL_R * 2.8;
    for (const b of balls) {
        const bx = b.x - sp.x;
        const by = b.y - sp.y;
        const proj = bx * dx + by * dy;
        if (proj > 0 && proj < len + safeDist) {
            const perp = Math.abs(bx * dy - by * dx);
            if (perp < safeDist) {
                len = Math.min(len, proj - safeDist);
            }
        }
    }
    len = Math.max(60, len);
    let guideColor = 'rgba(255, 230, 80, 0.55)';
    let glowColor = 'rgba(255, 230, 80, 0.15)';
    if (city.theme === 'babylon') { guideColor = 'rgba(120, 255, 200, 0.55)'; glowColor = 'rgba(120, 255, 200, 0.15)'; }
    else if (city.theme === 'china') { guideColor = 'rgba(255, 120, 100, 0.55)'; glowColor = 'rgba(255, 120, 100, 0.15)'; }
    ctx.save();
    const ex = sp.x + dx * len;
    const ey = sp.y + dy * len;
    // 外发光层
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = glowColor;
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.stroke();
    // 主线虚线
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = guideColor;
    ctx.lineWidth = 3.5;
    ctx.setLineDash([10, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

// ===================== 主循环 =====================
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    dt = Math.min(dt, 0.1);
    accumulator += dt;
    while (accumulator >= FIXED_DT) {
        update();
        accumulator -= FIXED_DT;
    }
    draw();
    requestAnimationFrame(loop);
}

// 启动
init();
</script>

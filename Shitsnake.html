<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>搞怪贪吃蛇 · 多模式 + 调速 + 真·惩罚模式（越吃越短）</title>
    <style>
        * {
            user-select: none;
            touch-action: manipulation;
        }
        body {
            background: #1a2a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            font-family: system-ui, 'Segoe UI', 'Courier New', monospace;
        }
        .game-container {
            background: #0f1f0f;
            border-radius: 32px;
            padding: 20px 20px 24px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background-color: #2b3b2b;
            border-radius: 20px;
            box-shadow: inset 0 0 0 2px #6f8f6f, 0 8px 20px rgba(0,0,0,0.3);
            width: 100%;
            height: auto;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 12px 8px 12px;
            color: #ffefcf;
            text-shadow: 2px 2px 0 #2a4a2a;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
        }
        .score-box {
            background: #2e2e1e;
            padding: 6px 16px;
            border-radius: 60px;
            font-size: 1.3rem;
        }
        .mode-select {
            background: #3a3a2a;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: none;
            color: #ffefcf;
            font-weight: bold;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2e2e1e;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .speed-control label {
            font-size: 0.8rem;
        }
        input[type="range"] {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            background: #ffb347;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #ffefcf;
            border-radius: 50%;
            cursor: pointer;
        }
        .speed-value {
            font-size: 0.8rem;
            min-width: 45px;
            background: #00000066;
            padding: 2px 6px;
            border-radius: 20px;
            text-align: center;
        }
        .restart-btn {
            background: #ffb347;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 60px;
            color: #2c2c1c;
            box-shadow: 0 4px 0 #a0522d;
            cursor: pointer;
        }
        .restart-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a0522d;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .arrow-row {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 5px 0;
        }
        .ctrl-btn {
            background: #4a3e2a;
            width: 70px;
            padding: 14px 0;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 50px;
            color: #ffecb3;
            box-shadow: 0 5px 0 #2a2a1a;
            cursor: pointer;
            transition: 0.03s linear;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2a2a1a;
        }
        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 0.8rem;
            background: #00000066;
            padding: 6px 18px;
            border-radius: 60px;
            color: #ffd966;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #7e9a6e;
            margin-top: 12px;
        }
        @media (max-width: 550px) {
            .ctrl-btn { width: 60px; padding: 12px 0; font-size: 1.8rem; }
            .arrow-row { gap: 15px; }
            .score-box { font-size: 1.1rem; }
            .speed-control { padding: 2px 8px; }
            input[type="range"] { width: 70px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="info">
        <span class="score-box" id="scoreDisplay">🍎 得分: <span id="scoreValue">0</span></span>
        <select id="modeSelect" class="mode-select">
            <option value="classic">💩 经典·蛇吃屎</option>
            <option value="dev">👨‍💻 程序员版 · 产品经理吃需求</option>
            <option value="worker">😭 打工人版 · 背锅侠</option>
            <option value="meme">🐶 魔性联动 · 狗头吃翔</option>
            <option value="punish">⚠️ 惩罚模式 · 越吃越短（满地💩）</option>
            <option value="reverse">🔄 反向操作 · 食物主动撞你</option>
        </select>
        <div class="speed-control">
            <label>🐌 速度</label>
            <input type="range" id="speedSlider" min="0.3" max="2.5" step="0.01" value="1.0">
            <span id="speedValue" class="speed-value">1.0x</span>
        </div>
        <button class="restart-btn" id="restartButton">🐍 重来</button>
    </div>
    <div class="controls">
        <div class="arrow-row"><div class="ctrl-btn" data-dir="up">▲</div></div>
        <div class="arrow-row">
            <div class="ctrl-btn" data-dir="left">◀</div>
            <div class="ctrl-btn" data-dir="down">▼</div>
            <div class="ctrl-btn" data-dir="right">▶</div>
        </div>
    </div>
    <div class="status" id="gameStatus">🎮 选择模式，滑动速度条，开始搞怪！</div>
    <footer>🐍 方向键 / 屏幕按钮 ｜ 惩罚模式：长蛇开局，吃💩变短，短到3即“吐屎而亡”</footer>
</div>

<script>
    (function(){
        // ----- 配置 -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreValue');
        const statusDiv = document.getElementById('gameStatus');
        const modeSelect = document.getElementById('modeSelect');
        const restartBtn = document.getElementById('restartButton');
        const speedSlider = document.getElementById('speedSlider');
        const speedValueSpan = document.getElementById('speedValue');

        const GRID_SIZE = 20;
        const CELL_SIZE = canvas.width / GRID_SIZE;
        const BASE_INTERVAL_MS = 150;
        
        let snake = [];
        let foods = [];          // 所有食物的数组（每个模式都用数组，非惩罚模式只有1个）
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let gameLoop = null;
        let gameRunning = true;
        let currentMode = 'classic';
        let currentSpeed = 1.0;
        
        // 惩罚模式特定参数
        const PUNISH_INIT_LEN = 10;      // 初始蛇长度
        const PUNISH_FOOD_COUNT = 10;     // 同时存在的食物数量（满地💩）
        const PUNISH_DEATH_LEN = 3;       // 长度 ≤ 3 时死亡
        
        let reverseInterval = null;
        
        // ----- 速度调节 -----
        function updateSpeedDisplay() {
            speedValueSpan.innerText = currentSpeed.toFixed(2) + 'x';
        }
        
        function applySpeed() {
            if (gameLoop) {
                clearInterval(gameLoop);
                if (gameRunning) {
                    let intervalMs = BASE_INTERVAL_MS / currentSpeed;
                    gameLoop = setInterval(gameTick, intervalMs);
                }
            }
        }
        
        // ----- 通用辅助函数 -----
        function updateScoreUI() {
            scoreSpan.innerText = score;
        }
        
        // 获取所有空闲格子（避开蛇身和可选排除的食物位置）
        function getAllFreeCells(excludeFoodPositions = null) {
            const snakeSet = new Set(snake.map(seg => `${seg.x},${seg.y}`));
            let free = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const key = `${i},${j}`;
                    if (!snakeSet.has(key)) {
                        if (excludeFoodPositions) {
                            if (!excludeFoodPositions.has(key)) free.push({ x: i, y: j });
                        } else {
                            free.push({ x: i, y: j });
                        }
                    }
                }
            }
            return free;
        }
        
        // 生成单个随机空闲位置
        function getRandomFreeCell(excludeSet = null) {
            let free = getAllFreeCells(excludeSet);
            if (free.length === 0) return null;
            return free[Math.floor(Math.random() * free.length)];
        }
        
        // ----- 惩罚模式专属：初始化多个💩 -----
        function initPunishFoods() {
            let newFoods = [];
            let usedSet = new Set();
            for (let i = 0; i < PUNISH_FOOD_COUNT; i++) {
                let pos = getRandomFreeCell(usedSet);
                if (pos) {
                    newFoods.push(pos);
                    usedSet.add(`${pos.x},${pos.y}`);
                } else {
                    break;
                }
            }
            foods = newFoods;
        }
        
        // 惩罚模式：吃掉一个💩后，在空位重生一个💩（保持总数）
        function respawnPunishFood(eatenIndex) {
            let currentFoodSet = new Set(foods.map(f => `${f.x},${f.y}`));
            let newPos = getRandomFreeCell(currentFoodSet);
            if (newPos) {
                foods[eatenIndex] = newPos;
            } else {
                // 没有空位（理论上蛇占满网格才会发生），那就减少一个食物
                foods.splice(eatenIndex, 1);
            }
        }
        
        // 检查惩罚模式死亡（长度过短）
        function checkPunishDeath() {
            if (currentMode === 'punish' && snake.length <= PUNISH_DEATH_LEN) {
                gameRunning = false;
                if (gameLoop) clearInterval(gameLoop);
                if (reverseInterval) clearInterval(reverseInterval);
                statusDiv.innerHTML = `💀 蛇吐屎而亡！ 最终长度 ${snake.length} 💀`;
                draw();
                return true;
            }
            return false;
        }
        
        // ----- 重置游戏（根据当前模式）-----
        function initGame() {
            if (reverseInterval) clearInterval(reverseInterval);
            
            if (currentMode === 'punish') {
                // 惩罚模式：初始长蛇
                snake = [];
                for (let i = 0; i < PUNISH_INIT_LEN; i++) {
                    snake.push({ x: 10 - i, y: 10 });
                }
                initPunishFoods();   // 生成 PUNISH_FOOD_COUNT 个 💩
                score = 0;
                updateScoreUI();
                gameRunning = true;
                statusDiv.innerHTML = `⚠️ 惩罚模式：长度${PUNISH_INIT_LEN}，场上${foods.length}坨💩！吃💩变短，≤${PUNISH_DEATH_LEN}就吐屎而亡！`;
            } 
            else {
                // 其他模式：标准蛇长3，单食物
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                // 生成单个有效食物
                let freeCells = getAllFreeCells();
                let rand = Math.floor(Math.random() * freeCells.length);
                foods = [freeCells[rand]];
                score = 0;
                updateScoreUI();
                gameRunning = true;
                if (currentMode === 'dev') statusDiv.innerHTML = '👨‍💻 产品经理：吃掉需求，功能越来越多！';
                else if (currentMode === 'worker') statusDiv.innerHTML = '😭 打工人：接锅越多，越背锅... 但还得活着';
                else if (currentMode === 'meme') statusDiv.innerHTML = '🐶 狗头：看到翔就控制不住自己';
                else if (currentMode === 'reverse') statusDiv.innerHTML = '🔄 反向模式：食物会主动来找你，小心被撞？';
                else statusDiv.innerHTML = '💩 经典模式：蛇吃屎，越吃越长';
            }
            
            direction = 'right';
            nextDirection = 'right';
            
            if (gameLoop) clearInterval(gameLoop);
            let intervalMs = BASE_INTERVAL_MS / currentSpeed;
            gameLoop = setInterval(gameTick, intervalMs);
            
            // 反向模式额外启动食物移动（只对单食物有效）
            if (currentMode === 'reverse') {
                reverseInterval = setInterval(() => {
                    if (!gameRunning) return;
                    moveFoodTowardsSnake();
                }, 400);
            }
            draw();
        }
        
        // 反向模式：食物向蛇头移动一步
        function moveFoodTowardsSnake() {
            if (!gameRunning || currentMode !== 'reverse') return;
            let food = foods[0];
            const head = snake[0];
            let dx = head.x - food.x;
            let dy = head.y - food.y;
            if (dx === 0 && dy === 0) return;
            let stepX = 0, stepY = 0;
            if (Math.abs(dx) > Math.abs(dy)) stepX = dx > 0 ? 1 : -1;
            else stepY = dy > 0 ? 1 : -1;
            let newX = food.x + stepX;
            let newY = food.y + stepY;
            newX = Math.min(GRID_SIZE-1, Math.max(0, newX));
            newY = Math.min(GRID_SIZE-1, Math.max(0, newY));
            const snakeSet = new Set(snake.map(seg => `${seg.x},${seg.y}`));
            if (!snakeSet.has(`${newX},${newY}`) || (newX === head.x && newY === head.y)) {
                foods[0] = { x: newX, y: newY };
            }
            draw();
        }
        
        // ----- 核心游戏逻辑（每 tick）-----
        function gameTick() {
            if (!gameRunning) return;
            direction = nextDirection;
            
            // 计算新头
            let newHead = { ...snake[0] };
            switch(direction) {
                case 'right': newHead.x++; break;
                case 'left': newHead.x--; break;
                case 'up': newHead.y--; break;
                case 'down': newHead.y++; break;
            }
            
            // 检查是否吃到食物（遍历 foods 数组）
            let ateIndex = -1;
            for (let i = 0; i < foods.length; i++) {
                if (newHead.x === foods[i].x && newHead.y === foods[i].y) {
                    ateIndex = i;
                    break;
                }
            }
            const willEat = (ateIndex !== -1);
            
            // --- 处理移动和吃食物 ---
            if (currentMode === 'punish') {
                // 惩罚模式：每吃一个💩，蛇身缩短一节（并且不增加长度）
                if (willEat) {
                    // 1. 蛇头移动到食物位置
                    snake.unshift(newHead);
                    // 2. 移除蛇尾（缩短一节）
                    if (snake.length > 1) snake.pop();
                    // 注意：上面两步净效果是长度不变（因为 unshift 加1，pop 减1）。要缩短，需要再删一个尾部
                    // 实际应该：吃食物时长度减1。所以再执行一次 pop（如果长度 > 1）
                    if (snake.length > 1) snake.pop();   // 额外再删一节，实现缩短
                    // 分数增加
                    score++;
                    updateScoreUI();
                    // 食物重生
                    respawnPunishFood(ateIndex);
                    // 检查死亡
                    if (checkPunishDeath()) {
                        draw();
                        return;
                    }
                } else {
                    // 没吃到：标准移动（头进尾出）
                    snake.unshift(newHead);
                    snake.pop();
                }
            } 
            else if (currentMode === 'reverse') {
                // 反向模式：标准贪吃蛇（吃后变长）
                if (willEat) {
                    snake.unshift(newHead);
                    score++;
                    updateScoreUI();
                    // 生成新食物
                    let freeCells = getAllFreeCells();
                    if (freeCells.length === 0) {
                        gameRunning = false;
                        if (gameLoop) clearInterval(gameLoop);
                        statusDiv.innerHTML = '🏆 奇迹！蛇赢了全世界！ 🏆';
                        draw();
                        return;
                    }
                    foods[0] = freeCells[Math.floor(Math.random() * freeCells.length)];
                } else {
                    snake.unshift(newHead);
                    snake.pop();
                }
            }
            else {
                // 正常模式（经典、程序员、打工人、魔性联动）：标准贪吃蛇
                if (willEat) {
                    snake.unshift(newHead);
                    score++;
                    updateScoreUI();
                    let freeCells = getAllFreeCells();
                    if (freeCells.length === 0) {
                        gameRunning = false;
                        if (gameLoop) clearInterval(gameLoop);
                        statusDiv.innerHTML = '🏆 奇迹！蛇赢了全世界！ 🏆';
                        draw();
                        return;
                    }
                    foods[0] = freeCells[Math.floor(Math.random() * freeCells.length)];
                } else {
                    snake.unshift(newHead);
                    snake.pop();
                }
            }
            
            // 碰撞检测（边界或自身）
            const headCollision = (
                newHead.x < 0 || newHead.x >= GRID_SIZE ||
                newHead.y < 0 || newHead.y >= GRID_SIZE ||
                checkSelfCollision(newHead)
            );
            if (headCollision) {
                gameOver();
                return;
            }
            
            // 惩罚模式再次检查死亡（因为移动后长度可能已触发）
            if (currentMode === 'punish') {
                if (checkPunishDeath()) return;
            }
            
            draw();
        }
        
        // 自身碰撞检测（忽略蛇头自身）
        function checkSelfCollision(head) {
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }
            return false;
        }
        
        function gameOver() {
            if (!gameRunning) return;
            gameRunning = false;
            if (gameLoop) clearInterval(gameLoop);
            if (reverseInterval) clearInterval(reverseInterval);
            statusDiv.innerHTML = `💀 游戏结束！得分 ${score} 点「重来」继续搞怪 💀`;
            draw();
        }
        
        // ----- 绘图（所有模式统一，但食物图标根据模式变化）-----
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 网格线
            ctx.strokeStyle = '#5f7f5f';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
            
            // 画蛇
            for (let i = 0; i < snake.length; i++) {
                const seg = snake[i];
                const x = seg.x * CELL_SIZE;
                const y = seg.y * CELL_SIZE;
                // 根据模式选择蛇身颜色
                if (currentMode === 'dev') {
                    ctx.fillStyle = '#3c6e71';
                    ctx.fillRect(x, y, CELL_SIZE-0.5, CELL_SIZE-0.5);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x+5, y+12, 10, 4);
                } else if (currentMode === 'worker') {
                    ctx.fillStyle = '#6c757d';
                    ctx.fillRect(x, y, CELL_SIZE-0.5, CELL_SIZE-0.5);
                    ctx.fillStyle = '#343a40';
                    ctx.beginPath();
                    ctx.ellipse(x+10, y+10, 5, 3, 0, 0, Math.PI*2);
                    ctx.fill();
                } else if (currentMode === 'meme') {
                    ctx.fillStyle = '#e9c46a';
                    ctx.fillRect(x, y, CELL_SIZE-0.5, CELL_SIZE-0.5);
                    ctx.fillStyle = '#b5835a';
                    ctx.fillRect(x+2, y+2, 4, 6);
                    ctx.fillRect(x+14, y+2, 4, 6);
                } else {
                    ctx.fillStyle = '#44aa44';
                    ctx.fillRect(x, y, CELL_SIZE-0.5, CELL_SIZE-0.5);
                }
                // 蛇头眼睛
                if (i === 0) {
                    ctx.fillStyle = 'white';
                    ctx.fillRect(x+12, y+5, 5, 5);
                    ctx.fillRect(x+3, y+5, 5, 5);
                    ctx.fillStyle = 'black';
                    ctx.fillRect(x+13, y+6, 2, 3);
                    ctx.fillRect(x+4, y+6, 2, 3);
                }
            }
            
            // 画食物（根据模式绘制不同图标，惩罚模式统一用💩）
            for (let f of foods) {
                const fx = f.x * CELL_SIZE;
                const fy = f.y * CELL_SIZE;
                if (currentMode === 'dev') {
                    ctx.fillStyle = '#f4a261';
                    ctx.fillRect(fx+2, fy+2, CELL_SIZE-4, CELL_SIZE-4);
                    ctx.fillStyle = '#e76f51';
                    ctx.font = `${CELL_SIZE-6}px monospace`;
                    ctx.fillText("需求", fx+4, fy+16);
                } else if (currentMode === 'worker') {
                    ctx.fillStyle = '#8b5a2b';
                    ctx.beginPath();
                    ctx.ellipse(fx+CELL_SIZE/2, fy+CELL_SIZE/2, 8, 6, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#d4a373';
                    ctx.font = "16px monospace";
                    ctx.fillText("锅", fx+6, fy+15);
                } else if (currentMode === 'meme') {
                    ctx.fillStyle = '#bc6c25';
                    ctx.fillRect(fx, fy, CELL_SIZE-1, CELL_SIZE-1);
                    ctx.fillStyle = '#fefae0';
                    ctx.font = "18px 'Segoe UI Emoji'";
                    ctx.fillText("💩", fx+2, fy+17);
                } else if (currentMode === 'punish') {
                    // 惩罚模式：💩 图标
                    ctx.fillStyle = '#8B5A2B';
                    ctx.beginPath();
                    ctx.ellipse(fx+CELL_SIZE/2, fy+CELL_SIZE/2, 8, 7, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#C47E3A';
                    ctx.font = "18px 'Segoe UI Emoji'";
                    ctx.fillText("💩", fx+4, fy+17);
                } else if (currentMode === 'reverse') {
                    ctx.fillStyle = '#e63946';
                    ctx.fillRect(fx+2, fy+2, CELL_SIZE-4, CELL_SIZE-4);
                    ctx.fillStyle = 'white';
                    ctx.font = "12px monospace";
                    ctx.fillText("撞", fx+5, fy+15);
                } else {
                    // 经典模式：💩
                    ctx.fillStyle = '#8B5A2B';
                    ctx.beginPath();
                    ctx.ellipse(fx+CELL_SIZE/2, fy+CELL_SIZE/2, 8, 7, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#C47E3A';
                    ctx.font = "18px 'Segoe UI Emoji'";
                    ctx.fillText("💩", fx+4, fy+17);
                }
            }
            
            // 游戏结束遮罩
            if (!gameRunning) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = 'bold 18px system-ui';
                ctx.fillStyle = '#ffcc88';
                ctx.fillText('💀 游戏结束 💀', canvas.width/2-80, canvas.height/2);
            }
        }
        
        // ----- 控制方向 -----
        function setDirection(newDir) {
            if (!gameRunning) return;
            const opposite = { 'up':'down', 'down':'up', 'left':'right', 'right':'left' };
            if (opposite[newDir] !== direction) nextDirection = newDir;
        }
        
        // ----- 事件绑定 -----
        function bindEvents() {
            window.addEventListener('keydown', (e) => {
                const key = e.key;
                if (key === 'ArrowUp') { setDirection('up'); e.preventDefault(); }
                else if (key === 'ArrowDown') { setDirection('down'); e.preventDefault(); }
                else if (key === 'ArrowLeft') { setDirection('left'); e.preventDefault(); }
                else if (key === 'ArrowRight') { setDirection('right'); e.preventDefault(); }
            });
            document.querySelectorAll('.ctrl-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const dir = btn.getAttribute('data-dir');
                    if (dir) setDirection(dir);
                });
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const dir = btn.getAttribute('data-dir');
                    if (dir) setDirection(dir);
                }, { passive: false });
            });
            restartBtn.addEventListener('click', () => {
                if (gameLoop) clearInterval(gameLoop);
                if (reverseInterval) clearInterval(reverseInterval);
                initGame();
            });
            modeSelect.addEventListener('change', (e) => {
                currentMode = e.target.value;
                if (gameLoop) clearInterval(gameLoop);
                if (reverseInterval) clearInterval(reverseInterval);
                initGame();
            });
            speedSlider.addEventListener('input', (e) => {
                currentSpeed = parseFloat(e.target.value);
                updateSpeedDisplay();
                if (gameRunning) applySpeed();
            });
        }
        
        // 启动
        updateSpeedDisplay();
        bindEvents();
        initGame();
    })();
</script>
</body>
</html>
